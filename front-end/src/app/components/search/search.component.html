<div class="flex flex-col items-center p-6 space-y-6">
  <!-- Search Bar -->
  <div class="w-full max-w-2xl flex space-x-2">
    <input
      [(ngModel)]="query"
      (keyup.enter)="onSearch()"
      type="text"
      placeholder="Search resumes (e.g., Python + AWS experience)"
      class="flex-1 px-4 py-2 border rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
    />
    <button
      (click)="onSearch()"
      class="px-5 py-2 bg-blue-600 text-white rounded-xl shadow hover:bg-blue-700 transition"
    >
      Search
    </button>
  </div>

  <!-- Loader -->
  <div *ngIf="loading" class="text-gray-500">Searching...</div>

  <!-- Summary -->
  <div *ngIf="summary" class="w-full max-w-2xl bg-green-50 border border-green-200 p-4 rounded-xl shadow">
    <h2 class="font-bold text-lg text-green-700">Summary</h2>
    <p class="text-gray-800 mt-2">{{ summary }}</p>
  </div>

  <!-- Results -->
  <div class="w-full max-w-2xl space-y-4">
    <div *ngFor="let result of results" class="bg-white p-4 border rounded-xl shadow hover:shadow-md transition">
      <p class="text-gray-600 text-sm">Score: {{ result.score | number: '1.2-2' }}</p>
      <p class="mt-2 text-gray-900">{{ result.resume_snippet }}</p>
    </div>
  </div>
</div>
